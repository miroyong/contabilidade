name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes do backend (Code.gs)
        run: node scripts/test-backend.js

      - name: Smoke test do front-end
        run: node scripts/test-frontend.js
